name: Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, ar-erp]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - run: echo '[{"url":"https://github.com/DavidContreras16/erp-autos-rodriguez-app","branch":"main"}]' > apps.json

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./frappe_docker
          file: ./frappe_docker/images/custom/Containerfile
          push: true
          no-cache: true
          secret-files: apps_json=apps.json
          build-args: FRAPPE_BRANCH=version-16
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/erp-autos-rodriguez:latest

      - run: curl -X POST ${{ secrets.PORTAINER_WEBHOOK_URL }}
        continue-on-error: true

      - run: docker image prune -f && docker builder prune -f
        if: always()
